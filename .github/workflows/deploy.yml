# Déploiement préprod : récupère les masters, encode le neuf, génère, rsync.
#
# Secrets requis : SSH_PRIVATE_KEY, SSH_HOST, SSH_USER, SSH_KNOWN_HOSTS, DEPLOY_PATH.
# DEPLOY_PATH doit contenir « preprod » (garde-fou : `rsync --delete` vers un
# mauvais chemin efface le site PHP en production, sans corbeille).
#
# PREMIER DÉPLOIEMENT : lancer manuellement (workflow_dispatch) avec dry_run=true
# et vérifier la liste des fichiers avant un vrai run.

name: Déploiement préprod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'rsync en --dry-run (aucune écriture côté serveur)'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 0 · Garde-fou avant tout : pas de --delete vers un chemin inattendu.
      - name: Vérifier la cible de déploiement
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          [[ "$DEPLOY_PATH" == *preprod* ]] \
            || { echo "::error::DEPLOY_PATH ne contient pas « preprod » — abandon."; exit 1; }

      - name: Configurer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # 1 · Masters : le cache évite de tout retélécharger.
      #     Clés indexées sur content/photos/** : le hash des fiches est connu
      #     avant tout téléchargement. restore-keys récupère le cache précédent.
      - name: Cache des masters
        uses: actions/cache@v4
        with:
          path: masters
          key: src-${{ hashFiles('content/photos/**') }}
          restore-keys: src-

      - name: Récupérer les masters
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: rsync -az "$SSH_USER@$SSH_HOST:masters/galerie/" masters/galerie/

      # 2 · Variantes : seul le neuf est encodé (cache par hash contenu + profil).
      - name: Cache des variantes
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: img-${{ hashFiles('content/photos/**') }}
          restore-keys: img-

      - name: Encoder les images
        run: node scripts/build-images.mjs

      # 3 · Build puis déploiement — séquentiel : pas de rsync si generate échoue.
      - name: Générer le site
        env:
          NUXT_PUBLIC_SITE_URL: https://preprod.brendanfleurdelys.ch
          NUXT_SITE_ENV: preview
        run: pnpm generate

      - name: Déployer
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: rsync -az --delete $DRY_RUN --itemize-changes .output/public/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
