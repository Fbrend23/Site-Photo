# Déploiement : récupère les masters, encode le neuf, génère, publie.
# Tout passe en FTPS (lftp) — Infomaniak ne gère pas les clés SSH, et les
# comptes FTP sont restreignables à un dossier, ce qui cloisonne chaque accès :
#
#   MASTERS_USER / MASTERS_PASSWORD — compte restreint à masters/ (photos sources)
#   DEPLOY_USER / DEPLOY_PASSWORD   — compte restreint au dossier du site PRÉPROD
#   PROD_USER / PROD_PASSWORD       — compte restreint au docroot de PRODUCTION
#
# Deux cibles :
#   préprod    — automatique à chaque push sur develop, ou manuelle
#   production — MANUELLE UNIQUEMENT (workflow_dispatch, cible « production »),
#                build avec l'URL canonique et robots.txt indexable
#
# Garde-fou par cible : un marqueur (.preprod-cible / .prod-cible) doit exister à
# la racine du compte visé, créé une fois à la main. Si les secrets pointent sur
# le mauvais compte, le marqueur n'y est pas et tout s'arrête avant écriture.
# Chaque compte étant chrooté sur son dossier, une erreur de cible ne peut de
# toute façon pas toucher l'autre site.
#
# PREMIER DÉPLOIEMENT d'une cible : dry_run=true, vérifier la liste des fichiers.

name: Déploiement

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      cible:
        description: 'Cible de déploiement'
        type: choice
        options: [preprod, production]
        default: preprod
      dry_run:
        description: 'mirror en --dry-run (aucune écriture côté serveur)'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.cible || 'preprod' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Un push déploie toujours la préprod ; la production exige le dispatch.
      CIBLE: ${{ inputs.cible || 'preprod' }}
      CIBLE_USER: ${{ inputs.cible == 'production' && secrets.PROD_USER || secrets.DEPLOY_USER }}
      CIBLE_PASSWORD: ${{ inputs.cible == 'production' && secrets.PROD_PASSWORD || secrets.DEPLOY_PASSWORD }}
      MARQUEUR: ${{ inputs.cible == 'production' && '.prod-cible' || '.preprod-cible' }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # 0 · Garde-fou avant tout : la cible doit porter son marqueur.
      - name: Vérifier la cible de déploiement
        run: |
          echo "Cible : $CIBLE (marqueur attendu : $MARQUEUR)"
          lftp -u "$CIBLE_USER,$CIBLE_PASSWORD" \
            -e "set ftp:ssl-force yes; set cmd:fail-exit yes; cls $MARQUEUR; quit" \
            "$FTP_HOST" \
            || { echo "::error::Marqueur $MARQUEUR absent sur la cible — abandon."; exit 1; }

      # 1 · Masters : le cache évite de tout retélécharger.
      #     Clés indexées sur content/photos/** : le hash des fiches est connu
      #     avant tout téléchargement. restore-keys récupère le cache précédent,
      #     et mirror ne télécharge que ce qui manque.
      - name: Cache des masters
        uses: actions/cache@v4
        with:
          path: masters
          key: src-${{ hashFiles('content/photos/**') }}
          restore-keys: src-

      - name: Récupérer les masters
        env:
          MASTERS_USER: ${{ secrets.MASTERS_USER }}
          MASTERS_PASSWORD: ${{ secrets.MASTERS_PASSWORD }}
        run: |
          mkdir -p masters/galerie
          lftp -u "$MASTERS_USER,$MASTERS_PASSWORD" \
            -e "set ftp:ssl-force yes; set cmd:fail-exit yes; mirror --verbose galerie/ masters/galerie/; quit" \
            "$FTP_HOST"

      # 2 · Variantes : seul le neuf est encodé (cache par hash contenu + profil).
      - name: Cache des variantes
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: img-${{ hashFiles('content/photos/**') }}
          restore-keys: img-

      - name: Encoder les images
        run: node scripts/build-images.mjs

      # 3 · Build puis déploiement — séquentiel : pas de publication si generate échoue.
      #     La préprod reste non indexable (NUXT_SITE_ENV=preview → robots bloquant).
      - name: Générer le site
        env:
          NUXT_PUBLIC_SITE_URL: ${{ inputs.cible == 'production' && 'https://photographie.brendanfleurdelys.ch' || 'https://preprod.brendanfleurdelys.ch' }}
          NUXT_SITE_ENV: ${{ inputs.cible == 'production' && 'production' || 'preview' }}
        run: pnpm generate

      # --exclude-glob préserve les marqueurs du --delete ; la racine du compte
      # de déploiement est le dossier du site, d'où la cible « ./ ».
      - name: Déployer
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          lftp -u "$CIBLE_USER,$CIBLE_PASSWORD" \
            -e "set ftp:ssl-force yes; set cmd:fail-exit yes; mirror -R --delete --parallel=4 --verbose $DRY_RUN --exclude-glob .preprod-cible --exclude-glob .prod-cible .output/public/ ./; quit" \
            "$FTP_HOST"
