# Déploiement préprod : récupère les masters, encode le neuf, génère, publie.
# Tout passe en FTPS (lftp) — Infomaniak ne gère pas les clés SSH, et les
# comptes FTP sont restreignables à un dossier, ce qui cloisonne chaque accès :
#
#   MASTERS_USER / MASTERS_PASSWORD — compte restreint à masters/ (photos sources)
#   DEPLOY_USER / DEPLOY_PASSWORD   — compte restreint au dossier du site préprod :
#                                     même en cas d'erreur, mirror --delete ne peut
#                                     pas toucher le site en production.
#
# Secrets requis : FTP_HOST, MASTERS_USER, MASTERS_PASSWORD, DEPLOY_USER, DEPLOY_PASSWORD.
#
# Garde-fou : le fichier .preprod-cible doit exister à la racine du compte de
# déploiement (créé une fois à la main). Si les secrets pointent sur le mauvais
# compte, le marqueur n'y est pas et le workflow s'arrête avant toute écriture.
#
# PREMIER DÉPLOIEMENT : lancer manuellement (workflow_dispatch) avec dry_run=true
# et vérifier la liste des fichiers avant un vrai run.

name: Déploiement préprod

# Déclenchement manuel uniquement tant que la préprod n'est pas validée —
# un trigger sur push lancerait un déploiement réel avant le premier dry_run.
# Une fois le premier déploiement vérifié, réactiver :
#   push:
#     branches: [develop]
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'mirror en --dry-run (aucune écriture côté serveur)'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # 0 · Garde-fou avant tout : la cible doit porter le marqueur préprod.
      - name: Vérifier la cible de déploiement
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" \
            -e "set ftp:ssl-force yes; set cmd:fail-exit yes; cls .preprod-cible; quit" \
            "$FTP_HOST" \
            || { echo "::error::Marqueur .preprod-cible absent sur la cible — abandon."; exit 1; }

      # 1 · Masters : le cache évite de tout retélécharger.
      #     Clés indexées sur content/photos/** : le hash des fiches est connu
      #     avant tout téléchargement. restore-keys récupère le cache précédent,
      #     et mirror ne télécharge que ce qui manque.
      - name: Cache des masters
        uses: actions/cache@v4
        with:
          path: masters
          key: src-${{ hashFiles('content/photos/**') }}
          restore-keys: src-

      - name: Récupérer les masters
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          MASTERS_USER: ${{ secrets.MASTERS_USER }}
          MASTERS_PASSWORD: ${{ secrets.MASTERS_PASSWORD }}
        run: |
          mkdir -p masters/galerie
          lftp -u "$MASTERS_USER,$MASTERS_PASSWORD" \
            -e "set ftp:ssl-force yes; set cmd:fail-exit yes; mirror --verbose galerie/ masters/galerie/; quit" \
            "$FTP_HOST"

      # 2 · Variantes : seul le neuf est encodé (cache par hash contenu + profil).
      - name: Cache des variantes
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: img-${{ hashFiles('content/photos/**') }}
          restore-keys: img-

      - name: Encoder les images
        run: node scripts/build-images.mjs

      # 3 · Build puis déploiement — séquentiel : pas de publication si generate échoue.
      - name: Générer le site
        env:
          NUXT_PUBLIC_SITE_URL: https://preprod.brendanfleurdelys.ch
          NUXT_SITE_ENV: preview
        run: pnpm generate

      # --exclude-glob préserve le marqueur du --delete ; la racine du compte
      # de déploiement est le dossier du site, d'où la cible « ./ ».
      - name: Déployer
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" \
            -e "set ftp:ssl-force yes; set cmd:fail-exit yes; mirror -R --delete --parallel=4 --verbose $DRY_RUN --exclude-glob .preprod-cible .output/public/ ./; quit" \
            "$FTP_HOST"
